<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noah See</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="1500" height="450" viewBox="0 -50 1500 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Glow filter -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
    <polyline
      id="first"
      points="100,200 200,0 200,200 100,400 0,400"
      stroke="white"
      filter="url(#glow)"
    />
    <polyline
      id="second"
      points="300,0 400,0 200,400 300,400 425,150 725,150 600,400 700,400 825,150 1025,150 1050,100 950,100"
      stroke="white"
      filter="url(#glow)"
    />
    <polyline
      id="third"
      points="500,400 400,400 500,200 600,200 525,350"
      stroke="white"
      filter="url(#glow)"
    />
    <polyline
      id="fourth"
      points="900,400 800,400 900,200 1000,200 925,350"
      stroke="white"
      filter="url(#glow)"
    />
    <polyline
      id="fifth"
      points="1100,400 1000,400 1200,0 1300,0 1125,350"
      stroke="white"
      filter="url(#glow)"
    />
    <polyline
      id="sixth"
      points="1300,400 1200,400 1300,200 1400,200 1325,350"
      stroke="white"
      filter="url(#glow)"
    />
  </svg>
  <script>
    const letters = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth'];
    const drawDelays = [0.25, 0.4, 0.65, 0.8, 0.95, 1.05];
    const undrawDelays = [3.05, 3.2, 3.45, 3.6, 3.75, 3.85];
    const dashArrays = [2000, 3000, 1500, 1500, 2000, 1500];
    
    function resetAnimations() {
      letters.forEach((id, index) => {
        const element = document.getElementById(id);
        element.style.animation = 'none';
        element.offsetHeight; // Trigger reflow
        element.style.strokeDashoffset = dashArrays[index];
      });
    }
    
    function startAnimation() {
      letters.forEach((id, index) => {
        const element = document.getElementById(id);
        const drawDelay = drawDelays[index];
        const undrawDelay = undrawDelays[index];
        const dashArray = dashArrays[index];
        
        element.style.animation = `
          draw${index + 1} 1s ${drawDelay}s forwards,
          undraw${index + 1} 1s ${undrawDelay}s forwards
        `;
      });
    }
    
    function runCycle() {
      resetAnimations();
      setTimeout(() => {
        startAnimation();
        
        // Calculate random delay between 5-20 seconds after animation completes
        // Animation completes at ~4.85s, so add random 5-20s = total 9.85-24.85s
        const randomDelay = 5000 + Math.random() * 15000; // 5-20 seconds in milliseconds
        const totalCycleTime = 4850 + randomDelay; // ~4.85s animation + random pause
        
        setTimeout(runCycle, totalCycleTime);
      }, 10);
    }
    
    // Start the first cycle
    runCycle();
  </script>
</body>
</html>
